[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "croa-attack"
version = "1.0.0"
description = "CROA: Cross-Representation Optimal Alignment for fine-grained targeted transfer attacks on MLLMs"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["croa*", "scripts*"]
